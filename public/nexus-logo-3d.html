<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS AI — Logo « N » 3D Ruban Continu</title>
  <style>
    /* ==========================================================================
       Styles de la page — Fond dégradé blanc-lavande, responsive et centré
       ========================================================================== */
    :root {
      --bg-top: #fbfcff;
      --bg-mid: #f1f0ff;
      --bg-bottom: #e6e9ff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 50% 38%, rgba(165, 243, 252, 0.35) 0%, rgba(167, 139, 250, 0.22) 32%, transparent 65%),
        radial-gradient(circle at 75% 65%, rgba(192, 132, 252, 0.20) 0%, transparent 55%),
        linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
      color: var(--text-primary);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .scene-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ambient-halo {
      position: absolute;
      width: min(540px, 80vw);
      height: min(540px, 80vw);
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(56, 189, 248, 0.32) 0%,
        rgba(124, 58, 237, 0.20) 42%,
        rgba(99, 102, 241, 0.10) 65%,
        transparent 78%
      );
      filter: blur(48px);
      pointer-events: none;
      z-index: 1;
      will-change: transform, opacity;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 2;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    .caption {
      position: absolute;
      bottom: clamp(18px, 3.5vh, 36px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      text-align: center;
      pointer-events: none;
    }

    .caption h1 {
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .caption h1 span {
      background: linear-gradient(90deg, #2563eb 0%, #7c3aed 55%, #06b6d4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .caption p {
      font-size: clamp(0.75rem, 1.4vw, 0.875rem);
      color: var(--text-secondary);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <main class="scene-wrapper" aria-label="Visualisation 3D du logo NEXUS AI">
    <div class="ambient-halo" id="ambient-halo" aria-hidden="true"></div>
    <div id="canvas-container" role="img" aria-label="Logo N en 3D sous forme de ruban continu replié"></div>

    <footer class="caption">
      <h1>Que peut faire <span>NEXUS AI</span> ?</h1>
      <p>Déplacez la souris pour incliner le ruban 3D et orienter la lumière • Cliquez pour donner une impulsion</p>
    </footer>
  </main>

  <script type="module">
    import * as THREE from 'three';

    // Respect de prefers-reduced-motion
    const mediaReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let prefersReducedMotion = mediaReducedMotion.matches;
    mediaReducedMotion.addEventListener('change', (e) => {
      prefersReducedMotion = e.matches;
    });

    const container = document.getElementById('canvas-container');
    const haloElement = document.getElementById('ambient-halo');

    // ── 1. Scène et Caméra centrée ──
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      30,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 5.4);
    camera.lookAt(0, 0, 0);

    // ── 2. Renderer WebGL haute fidélité ──
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    container.appendChild(renderer.domElement);

    const pivot = new THREE.Group();
    scene.add(pivot);

    // ── 3. Chargement des textures HD (diffuse et normales) ──
    const textureLoader = new THREE.TextureLoader();

    const loadTexture = (url, isSRGB = true) =>
      new Promise((resolve, reject) => {
        textureLoader.load(
          url,
          (tex) => {
            if (isSRGB) tex.colorSpace = THREE.SRGBColorSpace;
            tex.generateMipmaps = true;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            resolve(tex);
          },
          undefined,
          reject
        );
      });

    Promise.all([
      loadTexture('/nexus-logo-mockup-clean.png', true),
      loadTexture('/nexus-logo-normal.png', false),
    ]).then(([logoTex, normalTex]) => {
      // ── 4. Géométrie courbée 3D et Matériau MeshPhysicalMaterial ──
      const planeGeo = new THREE.PlaneGeometry(2.7, 2.7, 48, 48);
      const pos = planeGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const distSq = (x * x + y * y) / (1.35 * 1.35);
        const zCurve = Math.max(0, 1 - distSq) * 0.15;
        pos.setZ(i, zCurve);
      }
      planeGeo.computeVertexNormals();
      planeGeo.center();

      const planeMat = new THREE.MeshPhysicalMaterial({
        map: logoTex,
        normalMap: normalTex,
        normalScale: new THREE.Vector2(0.85, 0.85),
        transparent: true,
        alphaTest: 0.01,
        roughness: 0.15,
        metalness: 0.05,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        reflectivity: 0.7,
        iridescence: 0.35,
        iridescenceIOR: 1.35,
        depthWrite: false,
      });

      const mesh = new THREE.Mesh(planeGeo, planeMat);
      mesh.position.set(0, 0, 0);
      pivot.add(mesh);
    });

    // ── 5. Micro-poussières stellaires ──
    const dustCount = 30;
    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(dustCount * 3);
    const dustPhases = new Float32Array(dustCount);
    for (let i = 0; i < dustCount; i++) {
      dustPositions[i * 3] = (Math.random() - 0.5) * 3.8;
      dustPositions[i * 3 + 1] = (Math.random() - 0.5) * 3.2;
      dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 1.5 - 0.2;
      dustPhases[i] = Math.random() * Math.PI * 2;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustMat = new THREE.PointsMaterial({
      size: 0.035,
      color: new THREE.Color('#818cf8'),
      transparent: true,
      opacity: 0.28,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const dustPoints = new THREE.Points(dustGeo, dustMat);
    scene.add(dustPoints);

    // ── 6. Éclairage Studio & Réaction au Curseur ──
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.18);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.72);
    keyLight.position.set(2.4, 3.2, 3.5);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xa78bfa, 0.45);
    rimLight.position.set(-2.5, -1.5, 2.0);
    scene.add(rimLight);

    const cursorLight = new THREE.PointLight('#60a5fa', 1.6, 4.5, 1.5);
    cursorLight.position.set(0, 0.2, 2.2);
    scene.add(cursorLight);

    // ── 7. Interactions ──
    const pointerTarget = { x: 0, y: 0 };
    const pointerCurrent = { x: 0, y: 0 };
    let clickSpinBoost = 0;

    window.addEventListener('pointermove', (e) => {
      pointerTarget.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointerTarget.y = (e.clientY / window.innerHeight) * 2 - 1;
    });

    window.addEventListener('pointerleave', () => {
      pointerTarget.x = 0;
      pointerTarget.y = 0;
    });

    container.addEventListener('click', () => {
      if (!prefersReducedMotion) clickSpinBoost += 0.26;
    });

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener('resize', onWindowResize);

    // ── 8. Boucle d'animation à 60 FPS ──
    const clock = new THREE.Clock();
    let accumulatedSpin = 0;

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const motion = prefersReducedMotion ? 0 : 1;

      pointerCurrent.x += (pointerTarget.x - pointerCurrent.x) * 0.07;
      pointerCurrent.y += (pointerTarget.y - pointerCurrent.y) * 0.07;

      accumulatedSpin += clickSpinBoost;
      clickSpinBoost *= 0.93;

      // Flottement sinusoïdal
      const floatY = Math.sin(elapsed * 1.3) * 0.045 * motion;
      pivot.position.y = floatY;

      // Inclinaison réactive
      pivot.rotation.y = pointerCurrent.x * 0.32 + accumulatedSpin;
      pivot.rotation.x = -pointerCurrent.y * 0.22 + Math.cos(elapsed * 0.8) * 0.02 * motion;
      pivot.rotation.z = -pointerCurrent.x * 0.04;

      // Lumière spéculaire dynamique qui caresse le pli du N
      cursorLight.position.set(pointerCurrent.x * 2.2, -pointerCurrent.y * 2.0 + 0.3, 2.0);

      // Pulsation douce du halo d'ambiance
      const pulse = 0.5 + 0.5 * Math.sin(elapsed * 2.2);
      if (haloElement) {
        const haloScale = 1 + pulse * 0.07 * motion;
        haloElement.style.transform = `scale(${haloScale.toFixed(4)})`;
      }

      // Dérive des micro-poussières
      const dustPos = dustGeo.attributes.position;
      for (let i = 0; i < dustCount; i++) {
        const phase = dustPhases[i];
        const yInit = dustPositions[i * 3 + 1];
        dustPos.setY(i, yInit + Math.sin(elapsed * 0.6 + phase) * 0.08 * motion);
      }
      dustPos.needsUpdate = true;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
